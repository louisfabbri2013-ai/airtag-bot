name: Controllo prezzo AirTag

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla il prezzo
        run: python price_check.py
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_PRICE: ${{ secrets.TARGET_PRICE }}

      - name: Salva l'ultimo prezzo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_state.json
          git diff --cached --quiet || (git commit -m "aggiorna prezzo" && git push)
